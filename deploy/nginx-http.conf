# skillex.space: HTTP and legacy IP redirect to canonical HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name skillex.space www.skillex.space 132.243.195.86;
    return 301 https://skillex.space$request_uri;
}

server {
    listen 443 ssl;
    server_name www.skillex.space;
    ssl_certificate /etc/letsencrypt/live/skillex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillex.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://skillex.space$request_uri;
}

server {
    listen 443 ssl;
    server_name skillex.space;
    ssl_certificate /etc/letsencrypt/live/skillex.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skillex.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:13080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
