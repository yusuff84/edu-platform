services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: skillex
      POSTGRES_USER: skillex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U skillex -d skillex']
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    image: skillex-api:${RELEASE:?required}
    restart: unless-stopped
    mem_limit: 192m
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://skillex:${POSTGRES_PASSWORD}@db:5432/skillex?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:?required}
      PORT: '8080'
      GOMEMLIMIT: 128MiB
      PUBLIC_APP_URL: https://skillex.space
      ALLOWED_ORIGINS: https://skillex.space,https://www.skillex.space
      TRUSTED_PROXY_CIDRS: 172.31.86.0/28
      COOKIE_SAMESITE: lax
      CSRF_ALLOW_MISSING_ORIGIN: 'false'
      PAYMENTS_PROVIDER: disabled
      ADMIN_EMAIL: ${ADMIN_EMAIL:?required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?required}
      SMTP_TLS: starttls
      RUNNER_URL: http://runner:8081
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [default, runner_net]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: skillex-web:${WEB_RELEASE:-${RELEASE:?required}}
    restart: unless-stopped
    mem_limit: 64m
    ports: ['127.0.0.1:13080:80']
    depends_on: [api]

  runner:
    image: skillex-runner:${RELEASE:?required}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      RUNNER_SANDBOX: bubblewrap
      GOMEMLIMIT: 48MiB
    networks: [runner_net]
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, seccomp=unconfined, apparmor=skillex-runner, systempaths=unconfined]
    healthcheck:
      test: [CMD, python3, -c, 'import urllib.request;urllib.request.urlopen("http://127.0.0.1:8081/health",timeout=3)']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:

networks:
  default:
    ipam:
      config:
        - subnet: 172.31.86.0/28
  runner_net:
    internal: true
