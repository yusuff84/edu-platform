server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Обложки курсов принимаются через /api/ (backend — до 5 МБ): дефолтный
  # лимит nginx в 1 МБ обрезал бы загрузку ещё до api.
  client_max_body_size 6m;

  # Реальный IP посетителя. На проде запрос приходит от host-nginx через
  # docker-шлюз (172.31.86.1), а host-nginx кладёт адрес клиента в X-Real-IP.
  # Без этих строк ниже уходил $remote_addr = адрес шлюза, и API считал всех
  # посетителей одним IP: лимит входа (10/мин) был общим на весь сайт.
  # Доверяем только частным сетям Docker/loopback: порт web опубликован на
  # 127.0.0.1, снаружи подделать заголовок нельзя — host-nginx его перезаписывает.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Real-IP;

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # T54+T57: файлы обложек курсов отдаёт api (storage.LocalStore, /uploads/*).
  # Без этого location <img src="/uploads/covers/..."> получал бы index.html
  # (SPA-fallback) — «битые» обложки на стенде.
  location /uploads/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Mock-страница оплаты (/pay/mock/{id}) — HTML backend, а не SPA-роут.
  # Без location nginx отдал бы index.html (redirectUrl с 404).
  location /pay/mock {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # index.html не кешируем: после выкладки браузер сразу получает новые имена файлов сборки.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Файлы сборки с хешем в имени — неизменны, кешируются надолго. Отсутствующий
  # (старый) файл — честный 404, а не index.html: приложение перезагрузится на новую версию.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
