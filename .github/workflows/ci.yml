name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download Go modules
        working-directory: backend
        run: go mod download
      - name: Vet
        working-directory: backend
        run: go vet ./...
      # TEST_DATABASE_URL is intentionally not set: Postgres tests must skip here.
      - name: Test
        working-directory: backend
        run: go test -count=1 ./...
      - name: Race checks
        working-directory: backend
        run: go test -race -count=1 ./internal/... ./tests/contract

  postgres:
    name: Backend (Postgres integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edu
          POSTGRES_PASSWORD: edu
          POSTGRES_DB: edu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edu -d edu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://edu:edu@localhost:5432/edu_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download Go modules
        working-directory: backend
        run: go mod download
      # tests/postgres/helper_test.go opens TEST_DATABASE_URL and applies
      # internal/migrate/migrations itself; no separate migration step is needed.
      - name: Postgres integration tests
        working-directory: backend
        run: go test -count=1 ./tests/postgres ./internal/repo

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  runner:
    name: Runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUNNER_REQUIRE_SANDBOX_TEST: "1"
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache: false
      - name: Install namespace sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # runner tests execute python3/node when available and skip otherwise.
      # ubuntu-latest ships python3 in /usr/bin; setup-node installs node into
      # the tool cache, but runner children only see
      # PATH=/usr/local/bin:/usr/bin:/bin (see execEnv in main.go), so link it.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Expose node on the runner sandbox PATH
        run: |
          node_bin="$(command -v node)"
          if [ "$node_bin" != "/usr/local/bin/node" ]; then
            sudo ln -sf "$node_bin" /usr/local/bin/node
          fi
      - name: Check interpreters on the runner sandbox PATH
        run: |
          /usr/bin/python3 --version
          /usr/local/bin/node --version
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...

  browser:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: frontend/test-results/
          retention-days: 7
