openapi: 3.0.3
info:
  title: Edu Platform API
  version: 1.0.0
  description: MVP-ядро — каталог, конструктор, оплата, прогресс. Все ответы на русском для ошибок.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Регистрация по email+пароль
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string, format: email}
                password: {type: string, minLength: 8}
                inviteToken: {type: string, description: 'токен приглашения учителя, опционально'}
      responses:
        '201':
          description: Создан; при настроенной почте отправляется подтверждение email
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountUser'}
        '400': {description: Невалидные данные / email занят}
  /auth/login:
    post:
      summary: Вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: {type: string}
                password: {type: string}
      responses:
        '200':
          description: OK, ставится httpOnly cookie
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountUser'}
        '401': {description: Неверный логин или пароль}
  /auth/me:
    get:
      summary: Текущий пользователь
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: Пользователь и статус подтверждения email
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountUser'}
        '401': {description: Требуется вход}
  /auth/password/forgot:
    post:
      summary: Запросить одноразовую ссылку сброса пароля
      description: Одинаковый ответ для существующего, неизвестного, заблокированного аккаунта и cooldown. Ссылка действует 30 минут; не возвращается через API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, format: email, maxLength: 254}
      responses:
        '202': {$ref: '#/components/responses/AccountMessage'}
        '400': {description: Невалидный email}
        '429': {description: IP rate-limit}
        '503': {description: Почта отключена}
  /auth/password/reset:
    post:
      summary: Сменить пароль по одноразовой ссылке и отозвать все сессии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: {type: string, minLength: 43, maxLength: 43}
                password: {type: string, minLength: 8, description: Максимум 72 UTF-8 байта}
      responses:
        '200': {$ref: '#/components/responses/AccountMessage'}
        '400': {description: Ссылка неверна, истекла или использована; невалидный пароль}
        '429': {description: IP rate-limit}
        '500': {description: Ошибка сохранения; пароль и отзыв сессий откатываются вместе}
  /auth/email/verify:
    post:
      summary: Подтвердить email по одноразовой ссылке
      description: Ссылка действует 24 часа. GET страницы ничего не подтверждает; требуется явный POST.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 43, maxLength: 43}
      responses:
        '200': {$ref: '#/components/responses/AccountMessage'}
        '400': {description: Ссылка неверна, истекла или использована}
        '429': {description: IP rate-limit}
  /me/security:
    get:
      summary: Статус email и доступность отправки писем
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: Настройки безопасности текущего пользователя
          content:
            application/json:
              schema:
                type: object
                required: [email, emailVerified, emailVerifiedAt, emailDeliveryAvailable]
                properties:
                  email: {type: string}
                  emailVerified: {type: boolean}
                  emailVerifiedAt: {type: string, format: date-time, nullable: true}
                  emailDeliveryAvailable: {type: boolean, description: Настроен канал отправки писем}
        '401': {description: Требуется вход}
  /me/email/verification:
    post:
      summary: Повторно отправить подтверждение email
      security: [{CookieAuth: []}]
      responses:
        '200': {$ref: '#/components/responses/AccountMessage'}
        '202': {$ref: '#/components/responses/AccountMessage'}
        '401': {description: Требуется вход}
        '429': {description: Cooldown 60 секунд или IP rate-limit}
        '503': {description: Отправка недоступна}
  /me/sessions:
    get:
      summary: Активные сессии текущего пользователя без раскрытия cookie credentials
      security: [{CookieAuth: []}]
      responses:
        '200':
          description: Сессии с отдельными management IDs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AccountSession'}
        '401': {description: Требуется вход}
  /me/sessions/{sessionID}:
    delete:
      summary: Завершить свою сессию
      security: [{CookieAuth: []}]
      parameters:
        - {name: sessionID, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Сессия завершена; для текущей cookie удалена}
        '401': {description: Требуется вход}
        '404': {description: Своя сессия с таким management ID не найдена}
  /me/sessions/revoke-others:
    post:
      summary: Завершить все сессии кроме текущей
      security: [{CookieAuth: []}]
      responses:
        '204': {description: Другие сессии завершены}
        '401': {description: Требуется вход}
  /courses:
    get:
      summary: Каталог опубликованных курсов
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: Список с рейтингом и ценой}
  /courses/{slug}:
    get:
      summary: Страница курса
      description: Материалы обычных платных уроков доступны активному покупателю, владельцу и админу. Без покупки выдаются метаданные программы и разрешённое превью. Покупатель сохраняет доступ после archive/unpublish. Бесплатные материалы публичны.
      parameters:
        - {name: slug, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: 'Курс и программа; содержимое уроков по правам доступа, без правильных ответов и скрытых тестов для ученика'}
        '404': {description: Нет курса}
  /admin/payments/{id}/sync:
    post:
      summary: Сверить и восстановить платёж у провайдера (admin)
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: '{payment: PaymentJournalItem} с актуальным статусом'}
        '401': {description: Требуется вход}
        '403': {description: Требуется роль admin}
        '404': {description: Платёж не найден}
        '500': {description: Ошибка локальной записи}
        '502': {description: Ошибка платёжного провайдера}
  /teacher/courses:
    post:
      summary: Создать черновик курса
      responses:
        '201': {description: Создан черновик}
        '403': {description: Только учитель}
    get:
      summary: Мои курсы преподавания
      responses:
        '200': {description: Список}
  /teacher/courses/{id}/submit:
    post:
      summary: Отправить на модерацию
      responses:
        '200': {description: Статус review}
        '400': {description: Пустой курс нельзя}
  /teacher/courses/{id}/modules:
    post:
      summary: Создать модуль / переупорядочить
      responses:
        '201': {description: Модуль создан}
  /teacher/courses/{id}/lessons:
    post:
      summary: Создать урок (video_text|live|quiz|code)
      responses:
        '201': {description: Урок создан}
  /admin/invites:
    get:
      summary: Список приглашений (tokenPrefix, без сырого token)
      parameters:
        - {name: page, in: query, schema: {type: integer, default: 1}}
        - {name: limit, in: query, schema: {type: integer, default: 20}}
      responses:
        '200': {description: 'items/total/page/limit; элементы содержат tokenPrefix, но не token'}
    post:
      summary: Пригласить учителя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: {type: string, format: email}
      responses:
        '201': {description: 'Приглашение создано; token и inviteLink возвращаются один раз, emailSent — результат SMTP (может быть false)'}
  /admin/courses/review:
    get:
      summary: Очередь модерации
      responses:
        '200': {description: Курсы в review}
  /admin/courses/{id}/moderate:
    post:
      summary: Одобрить/отклонить с комментарием
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, reject]}
                comment: {type: string}
      responses:
        '200': {description: Статус published или draft}
  /enrollments:
    post:
      summary: Создать платеж и запись (покупка)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseId]
              properties:
                courseId: {type: string, format: uuid}
                promoCode: {type: string, description: 'необязательный промокод'}
      responses:
        '201': {description: Платеж создан, есть redirectUrl}
        '409': {description: Уже куплен}
  /payments/webhook/{provider}:
    post:
      summary: Webhook провайдера (идемпотентный)
      responses:
        '200': {description: 'Обработан, дубликат или проигнорирован (processed|duplicate|ignored)'}
  /me/courses:
    get:
      summary: Мои курсы с прогрессом
      responses:
        '200': {description: Список + percent + nextLesson}
  /me/courses/{id}/lessons/{lessonId}/complete:
    post:
      summary: Отметить урок пройденным / сдать квиз / сдать код
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                quizAnswers: {type: object}
                code: {type: string}
                language: {type: string, enum: [python, js, htmlcss]}
      responses:
        '200': {description: Вердикт + обновленный прогресс}
  /courses/{id}/reviews:
    get:
      summary: Отзывы курса
      responses:
        '200': {description: Список}
    post:
      summary: Оставить отзыв (1 на ученика)
      responses:
        '201': {description: Создан}
        '403': {description: Только записанные}
  /healthz:
    get:
      summary: Healthcheck
      responses:
        '200': {description: OK}
components:
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: session_id
  responses:
    AccountMessage:
      description: Сообщение пользователю
      content:
        application/json:
          schema:
            type: object
            required: [message]
            properties:
              message: {type: string}
  schemas:
    AccountUser:
      type: object
      required: [id, email, role, displayName, emailVerified]
      properties:
        id: {type: string, format: uuid}
        email: {type: string}
        role: {type: string, enum: [student, teacher, admin]}
        displayName: {type: string}
        emailVerified: {type: boolean}
    AccountSession:
      type: object
      required: [id, current, userAgent, ipAddress, createdAt, lastSeenAt, expiresAt]
      properties:
        id: {type: string, format: uuid, description: 'Management ID, не credential cookie'}
        current: {type: boolean}
        userAgent: {type: string}
        ipAddress: {type: string}
        createdAt: {type: string, format: date-time}
        lastSeenAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
