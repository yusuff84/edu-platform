<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#000}
svg{display:block}
</style></head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07403f"/>
      <stop offset="0.5" stop-color="#0d7a6f"/>
      <stop offset="1" stop-color="#19b394"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.5">
      <stop offset="0" stop-color="#a7f3d0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d8f7ec"/>
    </linearGradient>
    <linearGradient id="shieldIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c39b"/>
      <stop offset="1" stop-color="#0f8f78"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="1" stop-color="#0d1f30"/>
    </linearGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#032421" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- орбиты вокруг щита -->
  <g fill="none" stroke="#ccfbef" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="3 14" stroke-linecap="round">
    <ellipse cx="800" cy="420" rx="420" ry="300"/>
    <ellipse cx="800" cy="420" rx="300" ry="215" stroke-opacity="0.25"/>
  </g>

  <!-- телефон с кодом 2FA -->
  <g transform="translate(300 230) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="210" height="400" rx="34" fill="url(#phone)"/>
    <rect x="12" y="12" width="186" height="376" rx="26" fill="#f3fffb"/>
    <rect x="80" y="26" width="50" height="10" rx="5" fill="#cfe9e1"/>
    <circle cx="105" cy="118" r="40" fill="#d1fae5"/>
    <path d="M86 118 l13 13 l26 -28" fill="none" stroke="#059669" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g font-family="Manrope, 'Segoe UI', Arial, sans-serif" font-weight="800" fill="#0d1f30" text-anchor="middle">
      <text x="105" y="214" font-size="44" letter-spacing="2">482 913</text>
    </g>
    <rect x="40" y="244" width="130" height="10" rx="5" fill="#cfe9e1"/>
    <rect x="40" y="304" width="130" height="50" rx="16" fill="#10b981"/>
    <rect x="70" y="324" width="70" height="10" rx="5" fill="#ecfdf5"/>
  </g>

  <!-- карточка пароля -->
  <g transform="translate(1040 250)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="170" rx="24" fill="#ffffff"/>
    <rect x="26" y="26" width="110" height="12" rx="6" fill="#cfe9e1"/>
    <rect x="26" y="54" width="278" height="58" rx="14" fill="#f0fdf8" stroke="#a7e8d3" stroke-width="2.5"/>
    <g fill="#0d1f30">
      <circle cx="56" cy="83" r="8"/><circle cx="82" cy="83" r="8"/><circle cx="108" cy="83" r="8"/><circle cx="134" cy="83" r="8"/>
      <circle cx="160" cy="83" r="8"/><circle cx="186" cy="83" r="8"/><circle cx="212" cy="83" r="8"/><circle cx="238" cy="83" r="8"/>
    </g>
    <g>
      <rect x="26" y="132" width="62" height="12" rx="6" fill="#10b981"/>
      <rect x="96" y="132" width="62" height="12" rx="6" fill="#10b981"/>
      <rect x="166" y="132" width="62" height="12" rx="6" fill="#10b981"/>
      <rect x="236" y="132" width="68" height="12" rx="6" fill="#10b981"/>
    </g>
  </g>

  <!-- письмо-фишинг, перечёркнутое -->
  <g transform="translate(1110 520)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="156" rx="20" fill="#ffffff"/>
    <path d="M14 22 L115 92 L216 22" fill="none" stroke="#cfe9e1" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(206 2)">
      <circle r="38" fill="#fb7185"/>
      <path d="M-14 -14 L14 14 M14 -14 L-14 14" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- отпечаток пальца -->
  <g transform="translate(560 150)" filter="url(#shadow)">
    <circle r="62" fill="#fec466"/>
    <g fill="none" stroke="#5a3b00" stroke-width="5.5" stroke-linecap="round">
      <path d="M-24 18 C-30 -6 -18 -30 2 -30 C22 -30 30 -10 28 8"/>
      <path d="M-12 30 C-20 6 -12 -16 2 -16 C16 -16 18 2 16 16"/>
      <path d="M2 -2 C2 14 6 26 12 36"/>
      <path d="M28 22 C26 30 24 36 22 40"/>
    </g>
  </g>

  <!-- облако с резервной копией -->
  <g transform="translate(330 690)" filter="url(#shadow)">
    <path d="M60 120 h170 a56 56 0 0 0 4 -112 a78 78 0 0 0 -146 14 a54 54 0 0 0 -28 98 z" fill="#ffffff"/>
    <path d="M118 74 l20 20 l38 -40" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- главный щит с замком -->
  <g transform="translate(800 440)" filter="url(#shadow)">
    <path d="M0 -270 L210 -190 V-20 C210 130 110 230 0 280 C-110 230 -210 130 -210 -20 V-190 Z" fill="url(#shield)"/>
    <path d="M0 -222 L168 -158 V-24 C168 100 88 184 0 226 C-88 184 -168 100 -168 -24 V-158 Z" fill="url(#shieldIn)"/>
    <!-- замок -->
    <path d="M-52 -40 V-78 a52 52 0 0 1 104 0 V-40" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
    <rect x="-84" y="-48" width="168" height="140" rx="26" fill="#ffffff"/>
    <circle cx="0" cy="8" r="20" fill="#0f8f78"/>
    <rect x="-8" y="16" width="16" height="40" rx="8" fill="#0f8f78"/>
  </g>

  <!-- искры -->
  <g fill="#ffffff">
    <circle cx="470" cy="110" r="4" fill-opacity="0.7"/>
    <circle cx="1240" cy="170" r="3.5" fill-opacity="0.6"/>
    <circle cx="1420" cy="470" r="4" fill-opacity="0.5"/>
    <circle cx="250" cy="560" r="3" fill-opacity="0.55"/>
    <path d="M1460 140 l6 16 l16 6 l-16 6 l-6 16 l-6 -16 l-16 -6 l16 -6 z" fill-opacity="0.8"/>
    <path d="M200 140 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5 z" fill-opacity="0.6"/>
  </g>
</svg>
</body></html>
