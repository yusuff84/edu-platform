<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#000}
svg{display:block}
</style></head><body>
<svg width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a4a"/>
      <stop offset="0.55" stop-color="#2a2a9e"/>
      <stop offset="1" stop-color="#4635ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.38" r="0.55">
      <stop offset="0" stop-color="#7ca0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ca0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.09"/>
    </pattern>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3160"/>
      <stop offset="1" stop-color="#1a1e44"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4280"/>
      <stop offset="1" stop-color="#2c3368"/>
    </linearGradient>
    <linearGradient id="term" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1230"/>
      <stop offset="1" stop-color="#0a0d24"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9ecff"/>
    </linearGradient>
    <filter id="shadow" x="-60%" y="-60%" width="220%" height="240%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#05061a" flood-opacity="0.55"/>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- сетевые линии -->
  <g stroke="#9db1ff" stroke-opacity="0.45" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="2 12">
    <path d="M520 470 C 430 470, 400 330, 330 300"/>
    <path d="M520 560 C 420 580, 400 690, 330 720"/>
    <path d="M1080 330 C 1180 300, 1220 220, 1290 210"/>
    <path d="M1080 600 C 1190 620, 1220 700, 1290 730"/>
  </g>

  <!-- узлы сети: ноутбук -->
  <g transform="translate(220 230)" filter="url(#shadow)">
    <rect x="0" y="0" width="190" height="124" rx="14" fill="#e9ecff"/>
    <rect x="12" y="12" width="166" height="98" rx="8" fill="#2a2f6e"/>
    <rect x="28" y="30" width="80" height="10" rx="5" fill="#7ca0ff"/>
    <rect x="28" y="50" width="120" height="10" rx="5" fill="#4b55a8"/>
    <rect x="28" y="70" width="96" height="10" rx="5" fill="#4b55a8"/>
    <path d="M-22 124 h234 l-16 24 h-202 z" fill="#c9cff5"/>
  </g>

  <!-- узел: принтер -->
  <g transform="translate(230 660)" filter="url(#shadow)">
    <rect x="34" y="0" width="112" height="44" rx="6" fill="#ffffff"/>
    <rect x="0" y="34" width="180" height="84" rx="16" fill="#e9ecff"/>
    <rect x="34" y="96" width="112" height="56" rx="6" fill="#ffffff"/>
    <rect x="48" y="112" width="70" height="7" rx="3.5" fill="#c9cff5"/>
    <rect x="48" y="128" width="50" height="7" rx="3.5" fill="#c9cff5"/>
    <circle cx="148" cy="62" r="7" fill="#22c55e"/>
  </g>

  <!-- узел: роутер Wi-Fi -->
  <g transform="translate(1280 150)" filter="url(#shadow)">
    <rect x="0" y="70" width="190" height="62" rx="16" fill="#e9ecff"/>
    <rect x="28" y="0" width="12" height="80" rx="6" fill="#c9cff5"/>
    <rect x="150" y="0" width="12" height="80" rx="6" fill="#c9cff5"/>
    <circle cx="44" cy="101" r="7" fill="#22c55e"/>
    <circle cx="72" cy="101" r="7" fill="#22c55e"/>
    <circle cx="100" cy="101" r="7" fill="#fec466"/>
    <circle cx="128" cy="101" r="7" fill="#22c55e"/>
    <g fill="none" stroke="#fec466" stroke-width="7" stroke-linecap="round" transform="translate(95 -20)">
      <path d="M-26 -6 a 38 38 0 0 1 52 0"/>
      <path d="M-46 -26 a 66 66 0 0 1 92 0" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- узел: монитор -->
  <g transform="translate(1290 650)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="130" rx="14" fill="#e9ecff"/>
    <rect x="12" y="12" width="176" height="96" rx="8" fill="#2a2f6e"/>
    <path d="M40 80 l30 -26 l26 18 l40 -40" fill="none" stroke="#4ade80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="86" y="130" width="28" height="26" fill="#c9cff5"/>
    <rect x="56" y="154" width="88" height="12" rx="6" fill="#c9cff5"/>
  </g>

  <!-- стойка серверов -->
  <g transform="translate(520 170)" filter="url(#shadow)">
    <rect x="0" y="0" width="330" height="560" rx="28" fill="url(#rack)"/>
    <rect x="0" y="0" width="330" height="560" rx="28" fill="none" stroke="#5a64b8" stroke-opacity="0.6" stroke-width="3"/>
    <g>
      <g transform="translate(26 30)">
        <rect width="278" height="96" rx="14" fill="url(#unit)"/>
        <rect x="22" y="26" width="120" height="12" rx="6" fill="#5c67c4"/>
        <rect x="22" y="52" width="80" height="12" rx="6" fill="#4a539f"/>
        <circle cx="210" cy="48" r="9" fill="#4ade80"/><circle cx="210" cy="48" r="16" fill="#4ade80" fill-opacity="0.25"/>
        <circle cx="244" cy="48" r="9" fill="#4ade80"/>
      </g>
      <g transform="translate(26 140)">
        <rect width="278" height="96" rx="14" fill="url(#unit)"/>
        <rect x="22" y="26" width="120" height="12" rx="6" fill="#5c67c4"/>
        <rect x="22" y="52" width="100" height="12" rx="6" fill="#4a539f"/>
        <circle cx="210" cy="48" r="9" fill="#fec466"/><circle cx="210" cy="48" r="16" fill="#fec466" fill-opacity="0.25"/>
        <circle cx="244" cy="48" r="9" fill="#4ade80"/>
      </g>
      <g transform="translate(26 250)">
        <rect width="278" height="96" rx="14" fill="url(#unit)"/>
        <g fill="#141838">
          <rect x="22" y="30" width="26" height="22" rx="4"/><rect x="56" y="30" width="26" height="22" rx="4"/>
          <rect x="90" y="30" width="26" height="22" rx="4"/><rect x="124" y="30" width="26" height="22" rx="4"/>
          <rect x="158" y="30" width="26" height="22" rx="4"/>
        </g>
        <g fill="#4ade80"><circle cx="35" cy="66" r="4"/><circle cx="69" cy="66" r="4"/><circle cx="137" cy="66" r="4"/><circle cx="171" cy="66" r="4"/></g>
        <circle cx="103" cy="66" r="4" fill="#fec466"/>
        <circle cx="244" cy="48" r="9" fill="#4ade80"/>
      </g>
      <g transform="translate(26 360)">
        <rect width="278" height="96" rx="14" fill="url(#unit)"/>
        <rect x="22" y="26" width="120" height="12" rx="6" fill="#5c67c4"/>
        <rect x="22" y="52" width="60" height="12" rx="6" fill="#4a539f"/>
        <circle cx="210" cy="48" r="9" fill="#4ade80"/>
        <circle cx="244" cy="48" r="9" fill="#4ade80"/><circle cx="244" cy="48" r="16" fill="#4ade80" fill-opacity="0.25"/>
      </g>
      <g transform="translate(26 470)">
        <rect width="278" height="62" rx="14" fill="#232856"/>
        <g stroke="#3a4280" stroke-width="5" stroke-linecap="round"><path d="M30 22 h218"/><path d="M30 40 h218"/></g>
      </g>
    </g>
  </g>

  <!-- окно терминала -->
  <g transform="translate(760 300)" filter="url(#shadow)">
    <rect x="0" y="0" width="420" height="290" rx="22" fill="url(#term)"/>
    <rect x="0" y="0" width="420" height="290" rx="22" fill="none" stroke="#3b4495" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="8" fill="#ff5f57"/><circle cx="56" cy="30" r="8" fill="#febc2e"/><circle cx="82" cy="30" r="8" fill="#28c840"/>
    <g font-family="Menlo, 'SF Mono', 'DejaVu Sans Mono', monospace" font-size="23">
      <text x="28" y="94" fill="#7ca0ff">$</text><text x="52" y="94" fill="#e9ecff">ping 8.8.8.8</text>
      <text x="28" y="130" fill="#4ade80">64 bytes: time=12 ms</text>
      <text x="28" y="172" fill="#7ca0ff">$</text><text x="52" y="172" fill="#e9ecff">systemctl status</text>
      <text x="28" y="208" fill="#4ade80">● active (running)</text>
      <text x="28" y="250" fill="#7ca0ff">$</text>
      <rect x="54" y="232" width="14" height="24" fill="#e9ecff"/>
    </g>
  </g>

  <!-- значок: шестерёнка -->
  <g transform="translate(1110 160)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="58" fill="#fec466"/>
    <g fill="#1b1f4b" transform="scale(1.9)">
      <path d="M0 -18 l4 0 l1.5 5 a13 13 0 0 1 4 2.3 l5 -1.6 l2 3.4 l-3.8 3.6 a13 13 0 0 1 0 4.6 l3.8 3.6 l-2 3.4 l-5 -1.6 a13 13 0 0 1 -4 2.3 l-1.5 5 l-8 0 l-1.5 -5 a13 13 0 0 1 -4 -2.3 l-5 1.6 l-2 -3.4 l3.8 -3.6 a13 13 0 0 1 0 -4.6 l-3.8 -3.6 l2 -3.4 l5 1.6 a13 13 0 0 1 4 -2.3 l1.5 -5 z" transform="translate(0 0)"/>
      <circle cx="0" cy="0" r="5.5" fill="#fec466"/>
    </g>
  </g>

  <!-- значок: щит с галочкой -->
  <g transform="translate(470 760)" filter="url(#shadow)">
    <path d="M0 -62 L52 -42 V4 C52 40 28 64 0 76 C-28 64 -52 40 -52 4 V-42 Z" fill="#4ade80"/>
    <path d="M-20 4 l14 14 l28 -30" fill="none" stroke="#0f3d24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- лёгкие искры -->
  <g fill="#ffffff">
    <circle cx="700" cy="120" r="4" fill-opacity="0.7"/>
    <circle cx="1230" cy="480" r="3" fill-opacity="0.6"/>
    <circle cx="420" cy="520" r="3" fill-opacity="0.5"/>
    <circle cx="1450" cy="430" r="4" fill-opacity="0.5"/>
  </g>
</svg>
</body></html>
