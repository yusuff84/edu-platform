<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#141414; --muted:#6f6e6a; --line:#e3dfd5; --brand:#4635ff; --brand-soft:#eeedff; --sun:#fec466; --sun-soft:#fff3d4;
        --ok:#1f9d55; --ok-soft:#e4f5ea; --danger:#d33a2c; --danger-soft:#fdecea; --blue:#2f5bd9; --blue-soft:#e8efff; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font-family: Manrope, Arial, sans-serif; color: var(--ink); }
#art { width: 1600px; padding: 56px 64px; background: #fbfaf7; }
h1 { margin: 0 0 34px; font-size: 44px; font-weight: 800; }
.mono { font-family: 'JetBrains Mono', monospace; }
.wrap { display: grid; grid-template-columns: 630px 1fr; gap: 40px; align-items: start; }
.tree { border: 3px solid var(--line); border-radius: 24px; background: #fff; padding: 22px 18px; }
.here { font-size: 30px; font-weight: 800; margin-bottom: 20px; }
.here code { font-family: 'JetBrains Mono', monospace; color: #fff; background: var(--brand); padding: 4px 14px; border-radius: 12px; }
.r { display: grid; grid-template-columns: 250px 50px 1fr; align-items: center; gap: 8px; border: 3px solid var(--line); border-radius: 22px;
      background: #fff; padding: 16px 20px; margin-bottom: 16px; }
.r code { font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 700; background: #1b1d3a; color: #e9ecff; padding: 8px 16px; border-radius: 12px; justify-self: start; }
.r .ar { font-size: 38px; font-weight: 800; color: var(--brand); text-align: center; }
.r b { font-size: 30px; }
.r small { display: block; font-size: 24px; color: var(--muted); font-weight: 700; margin-top: 2px; }
.r.abs { border-color: #f2b33d; background: var(--sun-soft); }
.r.rel { border-color: var(--ok); background: var(--ok-soft); }
.r.up { border-color: var(--blue); background: var(--blue-soft); }
.r.here { border-color: var(--brand); background: var(--brand-soft); font-size: inherit; margin-bottom: 0; }
</style></head><body>
