<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Шаблон схемы для урока. Рисуем в #art (ширина 1600, высота — по содержимому, обычно 700–900).
   Светлый фон (урок светлый), акценты сайта. Текст на схеме — крупный: её смотрят и с телефона. */
:root { --ink:#141414; --muted:#6f6e6a; --line:#e3dfd5; --brand:#4635ff; --brand-soft:#eeedff; --sun:#fec466; --sun-soft:#fff3d4;
        --ok:#1f9d55; --ok-soft:#e4f5ea; --danger:#d33a2c; --danger-soft:#fdecea; --blue:#2f5bd9; --blue-soft:#e8efff; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font-family: Manrope, Arial, sans-serif; color: var(--ink); }
#art { width: 1600px; padding: 56px 64px; background: #fbfaf7; }
h1 { margin: 0 0 36px; font-size: 44px; font-weight: 800; }
.box { border: 3px solid var(--line); border-radius: 24px; background: #fff; padding: 24px 28px; font-size: 30px; font-weight: 700; }
.box small { display: block; font-size: 24px; color: var(--muted); font-weight: 600; margin-top: 6px; }
.brand { border-color: var(--brand); background: var(--brand-soft); }
.sun { border-color: #f2b33d; background: var(--sun-soft); }
.ok { border-color: var(--ok); background: var(--ok-soft); }
.danger { border-color: var(--danger); background: var(--danger-soft); }
.mono { font-family: 'JetBrains Mono', monospace; }
.row { display: flex; gap: 28px; align-items: center; }
.arrow { font-size: 44px; color: var(--brand); font-weight: 800; }
.caption { margin-top: 28px; font-size: 26px; color: var(--muted); font-weight: 600; }

.snake { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 90px; row-gap: 90px; position: relative; }
.card { position: relative; border: 3px solid var(--line); border-radius: 26px; background: #fff; padding: 26px 30px; min-height: 190px; }
.card .n { width: 58px; height: 58px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 800; margin-bottom: 14px; }
.card b { display: block; font-size: 36px; font-weight: 800; line-height: 1.15; }
.card span { display: block; font-size: 27px; color: var(--muted); font-weight: 600; margin-top: 8px; line-height: 1.3; }
.card.brand { border-color: var(--brand); background: var(--brand-soft); }
.card.sun { border-color: #f2b33d; background: var(--sun-soft); } .card.sun .n { background: #f2b33d; color: #141414; }
.card.ok { border-color: var(--ok); background: var(--ok-soft); } .card.ok .n { background: var(--ok); }
.card.danger { border-color: var(--danger); background: var(--danger-soft); } .card.danger .n { background: var(--danger); }
.ar { position: absolute; font-size: 56px; font-weight: 800; color: var(--brand); line-height: 1; }
.ar.r { right: -76px; top: 50%; transform: translateY(-50%); }
.ar.l { left: -76px; top: 50%; transform: translateY(-50%); }
.ar.d { bottom: -82px; left: 50%; transform: translateX(-50%); }
.note { margin-top: 40px; border-radius: 22px; padding: 22px 30px; font-size: 29px; font-weight: 700; background: var(--sun-soft); border: 3px dashed #f2b33d; }
.pill { display: inline-block; padding: 6px 18px; border-radius: 999px; font-size: 26px; font-weight: 800; }

.stairs { display: flex; gap: 24px; align-items: flex-end; height: 560px; }
.st { flex: 1; border-radius: 26px 26px 0 0; padding: 28px; border: 3px solid var(--line); border-bottom: none; background: #fff; }
.st .lvl { font-size: 25px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.st b { display: block; font-size: 38px; font-weight: 800; margin: 8px 0 10px; }
.st span { display: block; font-size: 27px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.s1 { height: 250px; background: var(--blue-soft); border-color: var(--blue); }
.s2 { height: 340px; background: var(--brand-soft); border-color: var(--brand); }
.s3 { height: 430px; background: var(--sun-soft); border-color: #f2b33d; }
.s4 { height: 550px; background: var(--ok-soft); border-color: var(--ok); }
.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.tags i { font-style: normal; font-size: 25px; font-weight: 700; background: #fff; border: 2px solid var(--ok); border-radius: 999px; padding: 6px 16px; }
</style></head><body>
<div id="art">
  <h1>Карьерная лестница сисадмина</h1>

<div class="stairs">
  <div class="st s1"><div class="lvl">Ступень 1</div><b>Техподдержка</b><span>первая линия: пароли, принтеры, почта, заявки</span></div>
  <div class="st s2"><div class="lvl">Ступень 2</div><b>Вторая линия</b><span>домен, политики, бэкапы, PowerShell</span></div>
  <div class="st s3"><div class="lvl">Ступень 3</div><b>Сисадмин</b><span>серверы, сеть, безопасность, автоматизация</span></div>
  <div class="st s4"><div class="lvl">Дальше</div><b>Специализация</b>
    <div class="tags"><i>Сети</i><i>DevOps / SRE</i><i>Безопасность</i><i>Linux-инженер</i><i>Руководитель ИТ</i></div></div>
</div>
</div>
</body></html>
