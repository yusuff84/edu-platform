<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root { --ink:#141414; --muted:#6f6e6a; --line:#e3dfd5; --brand:#4635ff; --brand-soft:#eeedff; --sun:#fec466; --sun-soft:#fff3d4;
        --ok:#1f9d55; --ok-soft:#e4f5ea; --danger:#d33a2c; --danger-soft:#fdecea; --blue:#2f5bd9; --blue-soft:#e8efff; }
* { box-sizing: border-box; }
body { margin: 0; background: #fff; font-family: Manrope, Arial, sans-serif; color: var(--ink); }
#art { width: 1600px; padding: 56px 64px; background: #fbfaf7; }
h1 { margin: 0 0 40px; font-size: 48px; font-weight: 800; line-height: 1.15; }
.box { border: 3px solid var(--line); border-radius: 24px; background: #fff; padding: 24px 28px; font-size: 34px; font-weight: 800; line-height: 1.2; }
.box small { display: block; font-size: 27px; color: var(--muted); font-weight: 600; margin-top: 8px; line-height: 1.3; }
.brand { border-color: var(--brand); background: var(--brand-soft); }
.sun { border-color: #f2b33d; background: var(--sun-soft); }
.ok { border-color: var(--ok); background: var(--ok-soft); }
.danger { border-color: var(--danger); background: var(--danger-soft); }
.blue { border-color: var(--blue); background: var(--blue-soft); }
.mono { font-family: 'JetBrains Mono', monospace; }
.row { display: flex; gap: 22px; align-items: stretch; }
.row > .box { flex: 1; }
.arrow { font-size: 48px; color: var(--brand); font-weight: 800; display: flex; align-items: center; }
.caption { margin-top: 32px; font-size: 28px; color: var(--muted); font-weight: 600; }
.tag { display: inline-block; font-size: 24px; font-weight: 800; padding: 6px 16px; border-radius: 999px; background: var(--brand); color: #fff; margin-bottom: 14px; }
.tag.ok { background: var(--ok); } .tag.sun { background: #e0a020; } .tag.danger { background: var(--danger); } .tag.gray { background: #8a877f; }
.num { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 28px; font-weight: 800; margin-bottom: 14px; }
code, .code { font-family: 'JetBrains Mono', monospace; font-size: .86em; background: rgba(0,0,0,.06); padding: 2px 10px; border-radius: 8px; font-weight: 700; }

h1 { font-size: 54px; margin-bottom: 40px; }
.box { font-size: 46px; padding: 26px 32px; }
.box small { font-size: 36px; }
.tag { font-size: 30px; padding: 8px 20px; }

.rows { display: grid; gap: 26px; }
.rw { font-weight: 600; }
.hd { font-size: 42px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; margin-bottom: 22px; }
.hd .tag { margin: 0; }
.hd b { font-weight: 800; }
.ch { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.nd { background: #fff; border: 3px solid var(--line); border-radius: 18px; padding: 12px 22px; font-size: 42px; font-weight: 800; }
.nd .mono { font-size: 34px; font-weight: 700; color: var(--muted); margin-left: 8px; }
.lk { font-size: 32px; font-weight: 800; color: var(--brand); }

</style></head><body>
<div id="art">
<h1>Три способа подключить принтер</h1><div class="rows"><div class="box rw"><div class="hd"><span class="tag gray">USB</span><span>Печатает <b>один</b> компьютер</span></div><div class="ch"><span class="nd">💻 ПК</span><span class="lk">кабель USB →</span><span class="nd">🖨 Принтер</span></div></div><div class="box ok rw"><div class="hd"><span class="tag ok">лучший вариант для офиса</span><span>Печатают <b>все</b>, нужен <b>постоянный IP</b></span></div><div class="ch"><span class="nd">💻💻💻 ПК офиса</span><span class="lk">сеть →</span><span class="nd">🖨 Принтер <span class="mono">192.168.1.50</span></span></div></div><div class="box sun rw"><div class="hd"><span class="tag sun">общий доступ</span><span>Работает, пока <b>ПК бухгалтера включён</b></span></div><div class="ch"><span class="nd">💻 ПК коллег</span><span class="lk">сеть →</span><span class="nd">💻 ПК бухгалтера</span><span class="lk">USB →</span><span class="nd">🖨 Принтер</span></div></div></div>
</div>
</body></html>
