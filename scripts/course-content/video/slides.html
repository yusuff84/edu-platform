<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Слайды видеоуроков skillex.space: 1280×720, макеты title/points/terminal/compare/steps/term/diagram/tip/summary. */
:root {
  --bg1: #151a4a; --bg2: #2a2a9e; --bg3: #4635ff;
  --accent: #fec466; --ok: #4ade80; --ink: #ffffff; --soft: rgba(255,255,255,.74);
  --card: rgba(255,255,255,.09); --card-line: rgba(255,255,255,.16);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body { font-family: Manrope, 'Segoe UI', Arial, sans-serif; color: var(--ink);
  background: radial-gradient(900px 560px at 70% 30%, rgba(124,160,255,.35), transparent 70%),
              linear-gradient(135deg, var(--bg1), var(--bg2) 58%, var(--bg3)); }
body::before { content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,.08) 1.3px, transparent 1.4px); background-size: 28px 28px; }
#s { position: relative; width: 1280px; height: 720px; padding: 64px 84px 92px; display: flex; flex-direction: column; }
.kicker { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: .02em; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.kicker::before { content: ''; width: 34px; height: 4px; border-radius: 4px; background: var(--accent); }
h1 { margin: 0; font-size: 52px; line-height: 1.12; font-weight: 800; letter-spacing: -.01em; max-width: 1060px; }
h2 { margin: 0 0 30px; font-size: 42px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; }
.sub { margin-top: 22px; font-size: 26px; line-height: 1.45; color: var(--soft); max-width: 900px; font-weight: 600; }
.foot { position: absolute; left: 84px; right: 84px; bottom: 34px; display: flex; align-items: center; justify-content: space-between; font-size: 17px; color: rgba(255,255,255,.6); font-weight: 700; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand i { width: 28px; height: 28px; border-radius: 8px; background: #fff; color: #4635ff; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 16px; }
.dots { display: flex; gap: 7px; }
.dots b { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.25); }
.dots b.on { background: var(--accent); width: 26px; border-radius: 6px; }
.nw { white-space: nowrap; }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding-bottom: 10px; }
/* title */
.title-wrap { margin: auto 0; display: grid; grid-template-columns: 1fr 460px; gap: 48px; align-items: center; }
.title-wrap.no-cover { grid-template-columns: 1fr; }
.title-art { width: 460px; aspect-ratio: 16/10; border-radius: 26px; background-size: cover; background-position: center; box-shadow: 0 30px 70px -25px rgba(0,0,0,.65); border: 2px solid rgba(255,255,255,.18); }
.title-wrap h1 { font-size: 58px; }
.badge { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: rgba(255,255,255,.12); border: 1px solid var(--card-line); font-size: 20px; font-weight: 700; margin-bottom: 26px; }
/* points */
.points { list-style: none; margin: 0; padding: 0; display: grid; gap: 24px; }
.points li { display: flex; gap: 22px; align-items: flex-start; font-size: 32px; line-height: 1.38; font-weight: 600; }
.points li .n { flex: none; width: 46px; height: 46px; border-radius: 14px; background: var(--accent); color: #1b1f4b; display: grid; place-items: center; font-weight: 800; font-size: 22px; margin-top: -2px; }
.points li b { color: var(--accent); font-weight: 800; }
.points li .t small { display: block; font-size: 22px; color: var(--soft); font-weight: 600; margin-top: 4px; }
.cols-2 .points { grid-template-columns: 1fr 1fr; gap: 22px 40px; }
/* terminal */
.term { flex: 1; border-radius: 22px; background: #0b0e26; border: 2px solid rgba(124,160,255,.35); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6); overflow: hidden; display: flex; flex-direction: column; }
.term-bar { height: 46px; display: flex; align-items: center; gap: 9px; padding: 0 20px; background: rgba(255,255,255,.05); }
.term-bar i { width: 13px; height: 13px; border-radius: 50%; } .term-bar i:nth-child(1){background:#ff5f57} .term-bar i:nth-child(2){background:#febc2e} .term-bar i:nth-child(3){background:#28c840}
.term-bar span { margin-left: 12px; font-size: 16px; color: rgba(255,255,255,.5); font-weight: 700; }
.term pre { margin: 0; padding: 22px 28px; font-family: 'JetBrains Mono', Menlo, monospace; font-size: 25px; line-height: 1.55; color: #e9ecff; white-space: pre-wrap; }
.term .p { color: #7ca0ff; } .term .o { color: #4ade80; } .term .c { color: #8b93c9; } .term .w { color: #fec466; }
.with-note { display: grid; grid-template-columns: 1fr 360px; gap: 28px; flex: 1; }
.note { border-radius: 20px; background: var(--card); border: 1px solid var(--card-line); padding: 24px; font-size: 22px; line-height: 1.5; font-weight: 600; color: var(--soft); }
.note b { color: #fff; display: block; font-size: 23px; margin-bottom: 8px; color: var(--accent); }
/* compare */
.compare { display: grid; gap: 26px; align-items: start; }
.card { border-radius: 22px; background: var(--card); border: 1px solid var(--card-line); padding: 26px 28px; }
.card h3 { margin: 0 0 16px; font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 12px; }
.card h3 .ic { width: 40px; height: 40px; border-radius: 12px; background: var(--accent); color: #1b1f4b; display: grid; place-items: center; font-size: 20px; }
.card ul { margin: 0; padding-left: 24px; font-size: 25px; line-height: 1.5; font-weight: 600; color: var(--soft); }
.card ul li::marker { color: var(--accent); }
.card.good { border-color: rgba(74,222,128,.55); background: rgba(74,222,128,.1); } .card.good h3 .ic { background: var(--ok); }
.card.bad { border-color: rgba(251,113,133,.55); background: rgba(251,113,133,.1); } .card.bad h3 .ic { background: #fb7185; color: #fff; }
/* steps */
.steps { display: grid; gap: 18px; }
.step { display: flex; gap: 22px; align-items: center; border-radius: 20px; background: var(--card); border: 1px solid var(--card-line); padding: 18px 24px; }
.step .n { flex: none; width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: #1b1f4b; display: grid; place-items: center; font-weight: 800; font-size: 26px; }
.step .t { font-size: 27px; line-height: 1.35; font-weight: 700; }
.step .t small { display: block; font-size: 21px; color: var(--soft); font-weight: 600; margin-top: 3px; }
.step code, .points code, .card code, .tip code { font-family: 'JetBrains Mono', monospace; font-size: .86em; padding: 2px 9px; border-radius: 8px; background: rgba(0,0,0,.3); color: #ffe3a3; }
/* term */
.term-card { margin: auto 0; display: grid; gap: 22px; max-width: 1040px; }
.term-word { font-size: 76px; font-weight: 800; line-height: 1.05; letter-spacing: -.015em; }
.term-word span { color: var(--accent); }
.term-def { font-size: 32px; line-height: 1.45; font-weight: 600; color: var(--soft); }
.term-ex { font-size: 24px; line-height: 1.5; font-weight: 600; border-left: 5px solid var(--accent); padding: 6px 0 6px 22px; color: #fff; }
/* diagram */
.diagram { flex: 1; display: flex; align-items: center; justify-content: center; }
.diagram > * { max-width: 100%; max-height: 100%; }
/* tip */
.tip { margin: auto 0; border-radius: 28px; padding: 38px 44px; background: rgba(255,255,255,.1); border: 2px solid var(--card-line); max-width: 1080px; }
.tip .lbl { display: inline-flex; align-items: center; gap: 12px; font-size: 22px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 16px; }
.tip .lbl i { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #1b1f4b; display: grid; place-items: center; font-style: normal; font-size: 22px; }
.tip p { margin: 0; font-size: 36px; line-height: 1.4; font-weight: 700; }
.tip.warn { border-color: rgba(254,196,102,.6); } .tip.danger { border-color: rgba(251,113,133,.7); } .tip.danger .lbl { color: #fda4af; } .tip.danger .lbl i { background: #fb7185; color: #fff; }
/* summary */
.summary { list-style: none; margin: 0; padding: 0; display: grid; gap: 20px; }
.summary li { display: flex; gap: 18px; align-items: flex-start; font-size: 30px; line-height: 1.38; font-weight: 600; }
.summary li::before { content: '✓'; flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--ok); color: #0f3d24; display: grid; place-items: center; font-weight: 800; font-size: 22px; margin-top: 0; }
.next { padding-top: 6px; margin-bottom: 4px; font-size: 24px; color: var(--soft); font-weight: 700; }
.next b { color: var(--accent); }
</style></head>
<body><div id="s"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
// Мини-разметка в текстах слайдов: **акцент**, `код`.
const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>')
  .replace(/(^|[\s(«>])([\wА-Яа-яЁё.]+(?:-[\wА-Яа-яЁё.]+)+)/g, '$1<span class="nw">$2</span>');
const item = (x) => typeof x === 'string' ? fmt(x) : `${fmt(x.text)}${x.sub ? `<small>${fmt(x.sub)}</small>` : ''}`;
function termLines(lines) {
  return (lines || []).map((l) => {
    if (l.startsWith('$ ') || l.startsWith('> ') || l.startsWith('# ') || l.startsWith('PS> ')) {
      const i = l.indexOf(' ');
      return `<span class="p">${esc(l.slice(0, i))}</span>${esc(l.slice(i))}`;
    }
    if (l.startsWith('// ')) return `<span class="c">${esc(l)}</span>`;
    if (l.startsWith('! ')) return `<span class="w">${esc(l.slice(2))}</span>`;
    return `<span class="o">${esc(l)}</span>`;
  }).join('\n');
}
window.renderSlide = (sl, meta) => {
  const theme = meta.theme || {};
  for (const [k, v] of Object.entries(theme)) document.documentElement.style.setProperty(`--${k}`, v);
  const kick = sl.kicker ?? meta.kicker ?? '';
  let h = '';
  switch (sl.layout) {
    case 'title':
      h = `<div class="title-wrap ${meta.cover ? '' : 'no-cover'}"><div><div class="badge">${esc(meta.course)}</div>${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h1>${fmt(sl.title)}</h1>${sl.subtitle ? `<div class="sub">${fmt(sl.subtitle)}</div>` : ''}</div>${meta.cover ? `<div class="title-art" style="background-image:url('${meta.cover}')"></div>` : ''}</div>`; break;
    case 'points':
      h = `${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h2>${fmt(sl.title)}</h2><div class="body ${sl.columns === 2 ? 'cols-2' : ''}"><ol class="points">${(sl.items || []).map((x, i) => `<li><span class="n">${i + 1}</span><span class="t">${item(x)}</span></li>`).join('')}</ol></div>`; break;
    case 'terminal':
      h = `${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h2>${fmt(sl.title)}</h2><div class="${sl.note ? 'with-note' : ''}" style="display:${sl.note ? 'grid' : 'flex'};flex:1"><div class="term"><div class="term-bar"><i></i><i></i><i></i><span>${esc(sl.shell || 'Терминал')}</span></div><pre>${termLines(sl.lines)}</pre></div>${sl.note ? `<div class="note"><b>${esc(sl.note.title || 'Обратите внимание')}</b>${fmt(sl.note.text)}</div>` : ''}</div>`; break;
    case 'compare': {
      const cols = sl.columns || [];
      h = `${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h2>${fmt(sl.title)}</h2><div class="body"><div class="compare" style="grid-template-columns:repeat(${cols.length},1fr)">${cols.map((c) => `<div class="card ${c.tone || ''}"><h3>${c.icon ? `<span class="ic">${esc(c.icon)}</span>` : ''}${fmt(c.title)}</h3><ul>${(c.items || []).map((x) => `<li>${fmt(x)}</li>`).join('')}</ul></div>`).join('')}</div></div>`; break;
    }
    case 'steps':
      h = `${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h2>${fmt(sl.title)}</h2><div class="body"><div class="steps">${(sl.items || []).map((x, i) => `<div class="step"><span class="n">${i + 1}</span><span class="t">${item(x)}</span></div>`).join('')}</div></div>`; break;
    case 'term':
      h = `<div class="term-card">${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<div class="term-word">${fmt(sl.term)}</div><div class="term-def">${fmt(sl.definition)}</div>${sl.example ? `<div class="term-ex">${fmt(sl.example)}</div>` : ''}</div>`; break;
    case 'diagram':
      h = `${kick ? `<div class="kicker">${esc(kick)}</div>` : ''}<h2>${fmt(sl.title)}</h2><div class="diagram">${sl.html || (sl.image ? `<img src="${esc(sl.image)}">` : '')}</div>`; break;
    case 'tip': {
      const tone = sl.tone || 'tip';
      const lbl = { tip: ['Совет', '✓'], warn: ['Внимание', '!'], danger: ['Опасно', '×'], important: ['Важно', '!'] }[tone] || ['Совет', '✓'];
      h = `<div class="tip ${tone}"><div class="lbl"><i>${lbl[1]}</i>${esc(sl.label || lbl[0])}</div><p>${fmt(sl.text)}</p></div>`; break;
    }
    case 'summary':
      h = `<div class="kicker">${esc(kick || 'Итоги')}</div><h2>${fmt(sl.title || 'Главное')}</h2><div class="body"><ul class="summary">${(sl.items || []).map((x) => `<li><span>${fmt(x)}</span></li>`).join('')}</ul></div>${sl.next ? `<div class="next">Дальше: <b>${fmt(sl.next)}</b></div>` : ''}`; break;
    default:
      h = `<h2>Неизвестный макет: ${esc(sl.layout)}</h2>`;
  }
  const dots = Array.from({ length: meta.total }, (_, i) => `<b class="${i === meta.index ? 'on' : ''}"></b>`).join('');
  document.getElementById('s').innerHTML = h + `<div class="foot"><span class="brand"><i>S</i>skillex.space · ${esc(meta.footer || '')}</span><span class="dots">${dots}</span></div>`;
};
</script>
</body></html>
